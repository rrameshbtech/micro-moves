<html lang="en">

  <head>
    <script>
      window.FontAwesomeConfig = {
        autoReplaceSvg: 'nest'
      };
    </script>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/js/all.min.js"
      crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // tailwind.config (IMPORTANT FOR STYLES)
      tailwind.config = {
        theme:
        {
          extend:
          {
            colors:
            {
              "border": "var(--border)",
              "input": "var(--input)",
              "ring": "var(--ring)",
              "background": "var(--background)",
              "foreground": "var(--foreground)",
              "primary":
              {
                "DEFAULT": "var(--primary)",
                "foreground": "var(--primary-foreground)",
              },
              "secondary":
              {
                "DEFAULT": "var(--secondary)",
                "foreground": "var(--secondary-foreground)",
              },
              "destructive":
              {
                "DEFAULT": "var(--destructive)",
                "foreground": "var(--destructive-foreground)",
              },
              "muted":
              {
                "DEFAULT": "var(--muted)",
                "foreground": "var(--muted-foreground)",
              },
              "accent":
              {
                "DEFAULT": "var(--accent)",
                "foreground": "var(--accent-foreground)",
              },
              "popover":
              {
                "DEFAULT": "var(--popover)",
                "foreground": "var(--popover-foreground)",
              },
              "card":
              {
                "DEFAULT": "var(--card)",
                "foreground": "var(--card-foreground)",
              },
              "sidebar":
              {
                "DEFAULT": "var(--sidebar)",
                "foreground": "var(--sidebar-foreground)",
                "primary": "var(--sidebar-primary)",
                "primary-foreground": "var(--sidebar-primary-foreground)",
                "accent": "var(--sidebar-accent)",
                "accent-foreground": "var(--sidebar-accent-foreground)",
                "border": "var(--sidebar-border)",
                "ring": "var(--sidebar-ring)",
              },
              "chart":
              {
                "1": "var(--chart-1)",
                "2": "var(--chart-2)",
                "3": "var(--chart-3)",
                "4": "var(--chart-4)",
                "5": "var(--chart-5)",
              },
            },
            "borderRadius":
            {
              "lg": "var(--radius)",
              "md": "calc(var(--radius) - 2px)",
              "sm": "calc(var(--radius) - 4px)",
            },
            "fontFamily":
            {
              "sans": ["var(--font-sans)"],
              "serif": ["var(--font-serif)"],
              "mono": ["var(--font-mono)"],
            },
            "boxShadow":
            {
              "2xs": "var(--shadow-2xs)",
              "xs": "var(--shadow-xs)",
              "sm": "var(--shadow-sm)",
              "DEFAULT": "var(--shadow)",
              "md": "var(--shadow-md)",
              "lg": "var(--shadow-lg)",
              "xl": "var(--shadow-xl)",
              "2xl": "var(--shadow-2xl)",
            },
          },
        }
      }
    </script>

    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap"
      rel="stylesheet">
    <link rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous" referrerpolicy="no-referrer">
    <style>
      body
      {
        font-family: var(--font-sans);
        background-color: var(--background);
        color: var(--foreground);
        margin: 0;
        padding: 0;
        -webkit-font-smoothing: antialiased;
      }

      ::-webkit-scrollbar
      {
        display: none;
      }
    </style>
    <style>
      :root
      {
        --background: #F1F3F1;
        --foreground: #717171;
        --card: #FFFFFF;
        --card-foreground: #2D2D2D;
        --primary: #6A9C78;
        --primary-foreground: #FFFFFF;
        --secondary: #E9EFEC;
        --secondary-foreground: #4A5D4E;
        --muted: #F1F3F1;
        --muted-foreground: #717171;
        --accent: #7FA8B6;
        --accent-foreground: #FFFFFF;
        --destructive: #D67D7D;
        --destructive-foreground: #FFFFFF;
        --border: #EAECEB;
        --input: #FFFFFF;
        --ring: #6A9C78;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        --font-serif: Georgia, serif;
        --font-mono: 'JetBrains Mono', monospace;
        --radius: 16px;
        --shadow: 0 4px 20px 0 rgba(0, 0, 0, 0.04);
      }
    </style>
  </head>

  <body class="m-0 p-0 flex justify-center bg-background min-h-[100dvh]">
    <!-- Main Mobile Container -->
    <main id="app-container"
      class="w-full max-w-[375px] bg-background relative flex flex-col h-[100dvh] mx-auto overflow-hidden shadow-2xl sm:border sm:border-border sm:rounded-[40px] sm:my-4 sm:h-[840px]">
      <!-- Header -->
      <header id="header"
        class="px-6 flex justify-between items-center z-10 bg-background pt-6 pb-3">
        <h1 id="il228"
          class="text-card-foreground font-medium tracking-tight text-[32px]">
          Micro Moves</h1>
      </header><!-- Scrollable Content Area -->
      <div id="scroll-area"
        class="flex-1 overflow-y-auto px-6 pb-32 flex flex-col gap-5">
        <!-- Date Context (Reference Style) -->
        <div id="date-context" class="mb-2">
          <p class="text-foreground text-[15px]">4 breaks scheduled</p>
        </div><!-- Active Break Card 1 -->
        <div id="break-card-1"
          class="bg-card rounded-[16px] p-5 shadow-[var(--shadow)] flex items-center justify-between transition-transform active:scale-[0.98]">
          <div class="flex flex-col gap-1">
            <h3 class="text-card-foreground font-bold text-[18px]">Palming Eye
              Exercise</h3>
            <div class="flex items-center gap-2"><span
                class="w-2 h-2 rounded-full bg-primary"></span>
              <p class="text-primary font-medium text-[15px]">in 12 mins</p>
            </div>
          </div><button
            class="bg-secondary text-secondary-foreground px-5 py-3 rounded-[12px] font-medium text-[15px] active:bg-border transition-colors">
            Pause
          </button>
        </div><!-- Active Break Card 2 -->
        <div id="break-card-2"
          class="bg-card rounded-[16px] p-5 shadow-[var(--shadow)] flex items-center justify-between transition-transform active:scale-[0.98]">
          <div class="flex flex-col gap-1">
            <h3 class="text-card-foreground font-bold text-[18px]">Neck
              Stretches</h3>
            <div class="flex items-center gap-2"><span
                class="w-2 h-2 rounded-full bg-primary"></span>
              <p class="text-primary font-medium text-[15px]">in 45 mins</p>
            </div>
          </div><button
            class="bg-secondary text-secondary-foreground px-5 py-3 rounded-[12px] font-medium text-[15px] active:bg-border transition-colors">
            Pause
          </button>
        </div><!-- Active Break Card 3 -->
        <div id="break-card-3"
          class="bg-card rounded-[16px] p-5 shadow-[var(--shadow)] flex items-center justify-between transition-transform active:scale-[0.98]">
          <div class="flex flex-col gap-1">
            <h3 class="text-card-foreground font-bold text-[18px]">Stand &amp;
              Walk</h3>
            <div class="flex items-center gap-2"><span
                class="w-2 h-2 rounded-full bg-primary"></span>
              <p class="text-primary font-medium text-[15px]">in 2 hrs</p>
            </div>
          </div><button
            class="bg-secondary text-secondary-foreground px-5 py-3 rounded-[12px] font-medium text-[15px] active:bg-border transition-colors">
            Pause
          </button>
        </div><!-- Paused Break Card -->
        <div id="break-card-paused"
          class="bg-muted rounded-[16px] p-5 border-border opacity-60 flex items-center justify-between transition-transform active:scale-[0.98] border">
          <div class="flex flex-col gap-1">
            <h3 class="text-muted-foreground font-bold text-[18px]">Shoulder
              Rolls</h3>
            <div class="flex items-center gap-2"><span id="ikx4g"
                class="w-2 h-2 rounded-full bg-border bg-[#717171]"></span>
              <p class="text-muted-foreground font-medium text-[15px]">Paused
                for 2 cycles</p>
            </div>
          </div><button id="i7xbp"
            class="bg-card text-foreground px-5 py-3 rounded-[12px] font-medium text-[15px] border border-border active:bg-muted transition-colors shadow-sm">
            Resume
          </button>
        </div><!-- Spacer for bottom scroll clearance -->
        <div class="h-8"></div>
      </div><!-- Fixed Bottom Action -->
      <div id="bottom-action-bar"
        class="absolute bottom-0 left-0 right-0 p-6 bg-gradient-to-t from-background via-background to-transparent pt-12 z-20">
        <button
          class="w-full h-[60px] bg-primary text-primary-foreground rounded-[16px] font-semibold text-[18px] shadow-[0_8px_20px_-8px_rgba(106,156,120,0.5)] active:scale-[0.98] transition-all flex items-center justify-center">
          Manage Breaks
        </button></div>
    </main>
  </body>

</html>
